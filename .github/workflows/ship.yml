# Builds the site from content/ and publishes it to GitHub Pages.
# Runs on every push to main, once a day (to refresh citation counts),
# and on demand from the Actions tab ("Run workflow").
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"   # 03:17 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: media-${{ hashFiles('media/**') }}
          restore-keys: media-

      - name: Check content (format, missing files, private data)
        run: npm run check

      - name: Check external links (daily run only)
        if: github.event_name == 'schedule'
        run: node engine/check.mjs --links

      - name: Build
        run: npm run build

      - name: Measure (Lighthouse) and write scores into the footer
        run: npm run audit
        continue-on-error: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
