# Builds the site from content/ and publishes it to GitHub Pages, together
# with a preview of every open pull request at /preview/pr-<number>/.
#
# Runs on every push to main, once a day (to refresh citation counts), every
# hour (to remove previews older than 6 hours), on demand from the Actions tab
# ("Run workflow"), when a pull request opens, changes or closes, and when the
# owner comments /preview on a pull request.
#
# Every run works out the whole picture again (see .github/scripts/preview.cjs),
# so a run that waits in the queue and gets replaced loses nothing.
#
# Safety: pull_request_target and issue_comment runs use this file and the
# scripts from main. Pull request code is built only in the "preview" job,
# which has read-only access, no secrets and no saved caches. Pull requests
# from forks are never built.
name: Build and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"   # daily, 03:17 KST: full build + external link check
    - cron: "41 * * * *"    # hourly: remove expired previews (no deploy when nothing changes)
  workflow_dispatch:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions: {}

# One deploy at a time, never cancelled. Comments other than the owner's
# /preview and pull requests from forks get their own group and stop at once,
# so they never push a waiting deploy out of the queue.
concurrency:
  group: ${{ ((github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'issue_comment' && !(github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/preview')))) && format('ignored-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ !((github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) || (github.event_name == 'issue_comment' && !(github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/preview')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      changes: ${{ steps.plan.outputs.changes }}
      deploy: ${{ steps.plan.outputs.deploy }}
      daily: ${{ steps.plan.outputs.daily }}
    steps:
      - uses: actions/checkout@v7   # main's copy, never the pull request's
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - id: plan
        uses: actions/github-script@v9
        with:
          script: await require('./.github/scripts/preview.cjs').plan({ github, context, core })

  # Certificate and activity photos live in the private photos repository.
  # Only this job holds the read-only PHOTOS_TOKEN; it strips metadata again
  # and hands the prepared photos to the builds through the Actions cache,
  # which (unlike artifacts) nobody outside the workflows can download.
  # Without the secret the site builds without those photos. If the secret is
  # set but the photos cannot be fetched, nothing is deployed.
  photos:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      key: ${{ steps.save.outputs.key }}
    steps:
      - id: has
        run: echo "token=${{ secrets.PHOTOS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.has.outputs.token == 'true'
        with:
          persist-credentials: false

      - uses: actions/checkout@v7
        if: steps.has.outputs.token == 'true'
        with:
          repository: ${{ github.repository_owner }}/photos
          token: ${{ secrets.PHOTOS_TOKEN }}
          path: photos-src
          persist-credentials: false

      - name: Warn before the photos token expires
        if: steps.has.outputs.token == 'true'
        env:
          TOKEN: ${{ secrets.PHOTOS_TOKEN }}
          REPO: ${{ github.repository_owner }}/photos
        run: |
          exp=$(curl -sI -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$REPO" | tr -d '\r' | grep -i '^github-authentication-token-expiration:' | cut -d' ' -f2-)
          if [ -z "$exp" ]; then echo "PHOTOS_TOKEN has no expiry date"; exit 0; fi
          days=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "PHOTOS_TOKEN expires $exp ($days days)"
          if [ "$days" -lt 30 ]; then echo "::warning::PHOTOS_TOKEN expires in $days days ($exp). Make a new token and replace the secret."; fi

      - uses: actions/setup-node@v7
        if: steps.has.outputs.token == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Prepare photos (strip metadata, cap size)
        if: steps.has.outputs.token == 'true'
        run: |
          npm ci --no-audit --no-fund
          node engine/photos.mjs photos-src photos

      - id: save
        if: steps.has.outputs.token == 'true'
        uses: actions/cache/save@v6
        with:
          path: photos
          key: photos-${{ github.run_id }}-${{ github.run_attempt }}

  site:
    needs: [plan, photos]
    if: needs.plan.outputs.deploy == 'true' && needs.photos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore photos
        if: needs.photos.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: photos
          key: ${{ needs.photos.outputs.key }}
          fail-on-cache-miss: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Restore image cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: media-${{ hashFiles('media/**') }}
          restore-keys: media-

      - name: Check content (format, missing files, private data)
        run: npm run check

      - name: Check external links (daily run only)
        if: needs.plan.outputs.daily == 'true'
        run: node engine/check.mjs --links

      - name: Build
        run: npm run build

      - name: Measure (Lighthouse) and write scores into the footer
        run: npm run audit
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 1

  preview:
    needs: [plan, photos]
    if: needs.plan.outputs.builds != '[]' && needs.plan.outputs.builds != '' && needs.photos.result == 'success'
    name: "Preview PR #${{ matrix.pr.number }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.pr.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false   # pull request code must not write caches main uses

      - name: Restore image cache (read only)
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: media-${{ hashFiles('media/**') }}
          restore-keys: media-

      - name: Restore photos (prepared by the photos job; no token here)
        if: needs.photos.outputs.key != ''
        uses: actions/cache/restore@v6
        with:
          path: photos
          key: ${{ needs.photos.outputs.key }}
          fail-on-cache-miss: true

      - name: Check that this branch can build previews
        run: |
          if ! grep -q -- '--preview' engine/build.mjs; then
            echo "::error::This branch is older than preview support. Merge main into it, then push again."
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check content
        run: npm run check

      - name: Build preview
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
        run: node engine/build.mjs --preview="$PR_NUMBER"

      - name: Pack as pr-<number>/
        env:
          PR_NUMBER: ${{ matrix.pr.number }}
        run: |
          rm -rf out && mkdir out
          mv _site "out/pr-$PR_NUMBER"

      - uses: actions/upload-artifact@v7
        with:
          name: preview-${{ matrix.pr.number }}
          path: out
          retention-days: 1

  assemble:
    needs: [plan, site, preview]
    outputs:
      removed: ${{ steps.removed.outputs.list }}
      removed_count: ${{ steps.removed.outputs.count }}
    if: always() && needs.plan.outputs.deploy == 'true' && needs.site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - uses: actions/download-artifact@v8
        if: needs.preview.result != 'skipped'
        continue-on-error: true   # every preview may have failed; the site still ships
        with:
          pattern: preview-*
          path: previews
          merge-multiple: true   # each artifact holds only pr-<number>/

      - name: Put previews under /preview/
        run: |
          for dir in previews/pr-*; do
            [ -d "$dir" ] || continue
            n="${dir#previews/pr-}"
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            mkdir -p _site/preview
            mv "$dir" "_site/preview/pr-$n"
            echo "preview of #$n → /preview/pr-$n/"
          done

      - id: pages
        uses: actions/configure-pages@v6

      # List the live site's image files so the verify job can check that
      # images dropped by this deploy really stop being served.
      - id: removed
        name: List images this deploy removes
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          (cd _site && find media -type f | sort) > _site/media-files.txt
          curl -sf "$BASE/media-files.txt" | sort > old-media-files.txt || true
          comm -23 old-media-files.txt _site/media-files.txt > removed.txt
          echo "count=$(wc -l < removed.txt)" >> "$GITHUB_OUTPUT"
          { echo 'list<<EOF'; head -n 300 removed.txt; echo EOF; } >> "$GITHUB_OUTPUT"
          echo "$(wc -l < removed.txt) image file(s) leave the site with this deploy"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: assemble
    if: always() && needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A deleted photo is gone from the site only once its old addresses answer
  # 404. GitHub's cache can serve them for up to ~10 minutes, so retry.
  verify:
    needs: [assemble, deploy]
    if: needs.deploy.result == 'success' && needs.assemble.outputs.removed_count != '0'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check that removed images answer 404
        env:
          BASE: ${{ needs.deploy.outputs.url }}
          REMOVED: ${{ needs.assemble.outputs.removed }}
        run: |
          printf '%s\n' "$REMOVED" | sed '/^$/d' > removed.txt
          for round in $(seq 1 12); do
            left=0
            while read -r f; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE%/}/$f")
              [ "$code" = "404" ] || { left=$((left+1)); echo "still served ($code): $f"; }
            done < removed.txt
            if [ "$left" = 0 ]; then echo "All $(wc -l < removed.txt) removed image file(s) answer 404."; exit 0; fi
            echo "round $round: $left still served, waiting 75 s"; sleep 75
          done
          echo "::warning::$left removed image file(s) are still served after 15 minutes. Check the log and try again later."

  report:
    needs: [plan, preview, assemble, deploy]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.builds != '[]' || needs.plan.outputs.changes != '[]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7   # main's copy, never the pull request's
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          BUILDS: ${{ needs.plan.outputs.builds }}
          CHANGES: ${{ needs.plan.outputs.changes }}
          DEPLOYED: ${{ needs.deploy.result }}
        with:
          script: await require('./.github/scripts/preview.cjs').report({ github, context, core })
